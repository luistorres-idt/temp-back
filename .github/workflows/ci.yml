name: CI

on:
  push:
    branches:
      - main
      - dev
      - 'feat/**'
      - 'refactor/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - dev

jobs:
  # ─── Job 1: Tests unitarios ─────────────────────────────────────────────────
  test:
    name: Tests unitarios
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        # Lee la version exacta desde packageManager en package.json (pnpm@10.9.0)
        # No se especifica version aqui para evitar conflictos

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Ejecutar tests con cobertura
        run: pnpm test:coverage

      - name: Subir reporte de cobertura a Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
        continue-on-error: true

  # ─── Job 2: Build TypeScript ─────────────────────────────────────────────────
  build:
    name: Compilacion TypeScript
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar cliente Prisma
        run: pnpm prisma generate
        env:
          DATABASE_URL: "mysql://ci:ci@localhost:3306/ci"

      - name: Compilar TypeScript
        run: pnpm build

