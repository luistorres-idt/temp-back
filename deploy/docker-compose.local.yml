version: '3.9'

services:

  nginx:
    image: nginx:alpine
    container_name: temp-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../front/dist:/usr/share/nginx/html:ro
    networks:
      - temp-net
    depends_on:
      backend-api:
        condition: service_healthy

  backend-api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: temp-backend
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env.docker
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - temp-net

  redis:
    image: redis:7-alpine
    container_name: temp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - temp-net

networks:
  temp-net:
    driver: bridge
