user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    sendfile on;
    keepalive_timeout 65;

    # Optimización Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstream para el Backend de TypeScript
    upstream backend_api {
        server backend-api:3000;
    }

    server {
        listen 80;
        server_name _; # Cambia el "_" por tu dominio si tienes uno (ej. app.midominio.com)

        # SEGURIDAD: Bloquear archivos ocultos (que empiezan con punto, ej: .env, .git)
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # SEGURIDAD: Bloquear archivos sensibles, de desarrollo y backups
        location ~* (composer\.(json|lock)|package(-lock)?\.json|pnpm-lock\.yaml|Dockerfile|docker-compose\.yml|sftp\.json|\.sql|\.bak|\.old)$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # FRONTEND VUE STATIC
        # Sirve los archivos estáticos desde Nginx directamente para ahorrar memoria y CPU
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # SERVER-SENT EVENTS (SSE) STREAM
        # Desactiva el buffering de Nginx para permitir el flujo en tiempo real (SSE)
        location /api/monitoring/telemetria/stream {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 24h;
            proxy_send_timeout 24h;
        }

        # BACKEND API TYPESCRIPT
        # Todas las peticiones que empiecen con /api/ van al backend de Node
        location /api/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # WEBSOCKETS SOCKET.IO
        location /socket.io/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
