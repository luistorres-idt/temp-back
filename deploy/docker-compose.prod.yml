version: '3.9'

services:
  nginx:
    image: nginx:alpine
    container_name: temp-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Montamos el build compilado de Vue para servir estáticos directamente (sin gastar RAM de Node)
      - ../../front/dist:/usr/share/nginx/html:ro
      # Carpetas de certbot opcionales para SSL a futuro
      #- ./certbot/conf:/etc/letsencrypt
      #- ./certbot/www:/var/www/certbot
    networks:
      - temp-net
    depends_on:
      - backend-api

  backend-api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: temp-backend
    restart: always
    expose:
      - "3000" # Puerto interno en la red Docker (NO mapeado al host directo, Nginx accede)
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=mysql://root:root@mysql-db:3306/temp
      - DATABASE_HOST=mysql-db
      - DATABASE_USER=root
      - DATABASE_PASSWORD=root
      - DATABASE_NAME=temp
    # El healthcheck verifica si la API responde. Si se congela (pero el proceso no muere), Docker lo reinicia.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"] # Ajusta la URL a un endpoint válido
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - temp-net
    depends_on:
      mysql-db:
        condition: service_healthy

  mysql-db:
    image: mysql:8.0
    container_name: temp-mysql
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: temp
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - temp-net

networks:
  temp-net:
    driver: bridge

volumes:
  mysql_data:
